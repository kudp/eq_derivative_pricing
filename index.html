<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ミニ・インベーダー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <main class="game-shell">
      <section class="hero-card" aria-labelledby="gameTitle">
        <p class="eyebrow">Retro Browser Game</p>
        <h1 id="gameTitle">ミニ・インベーダー</h1>
        <p class="hero-copy">
          迫りくるインベーダーを撃ち落とす、ブラウザだけで遊べるシンプルなシューティングゲームです。
        </p>
      </section>

      <section class="game-card" aria-label="インベーダーゲーム">
        <div class="hud" aria-live="polite">
          <div>
            <span>スコア</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span>レベル</span>
            <strong id="level">1</strong>
          </div>
          <div>
            <span>ライフ</span>
            <strong id="lives">3</strong>
          </div>
        </div>

        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="720" height="520" aria-label="ゲーム画面"></canvas>
          <div id="overlay" class="overlay">
            <div>
              <p id="overlayKicker">Ready?</p>
              <h2 id="overlayTitle">侵略を止めよう</h2>
              <p id="overlayText">スタートを押すか、スペースキーでゲーム開始。</p>
            </div>
          </div>
        </div>

        <div class="controls">
          <button id="startButton" type="button">スタート</button>
          <button id="pauseButton" type="button">一時停止</button>
          <button id="resetButton" type="button">リセット</button>
        </div>

        <div class="touch-controls" aria-label="タッチ操作">
          <button data-touch="left" type="button" aria-label="左へ移動">←</button>
          <button data-touch="shoot" type="button" aria-label="ショット">●</button>
          <button data-touch="right" type="button" aria-label="右へ移動">→</button>
        </div>
      </section>

      <aside class="how-to-play" aria-labelledby="howToPlayTitle">
        <h2 id="howToPlayTitle">遊び方</h2>
        <ul>
          <li><kbd>←</kbd> <kbd>→</kbd> または <kbd>A</kbd> <kbd>D</kbd> で移動。</li>
          <li><kbd>Space</kbd> でショット。インベーダーを全滅させるとレベルアップ。</li>
          <li>敵の弾や着地を避けながら、できるだけ高得点を狙いましょう。</li>
        </ul>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
