<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>気温 × FTSE 相関ダッシュボード</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="dashboard-shell" aria-labelledby="appTitle">
      <header class="hero-panel">
        <div>
          <p class="kicker">TEMPERATURE / FTSE 100 / LINEAR REGRESSION</p>
          <h1 id="appTitle">日次の気温とFTSE株価の相関ダッシュボード</h1>
          <p class="lead">
            過去の日次平均気温とFTSE 100終値を散布図にし、単回帰モデルで明日の気温から株価水準を推定します。
          </p>
        </div>
        <label class="forecast-input">
          <span>明日の気温</span>
          <input id="tomorrowTemperature" type="number" min="-10" max="45" step="0.1" aria-label="明日の予想気温" />
          <strong>℃</strong>
        </label>
      </header>

      <section id="metricGrid" class="metric-grid" aria-label="相関と回帰のサマリー"></section>

      <section class="workspace" aria-label="相関プロットと回帰結果">
        <section class="panel plot-panel" aria-labelledby="plotTitle">
          <div class="panel-title">
            <div>
              <span id="plotTitle">履歴散布図 + 回帰線 + 予想ポイント</span>
              <small>横軸: 日次平均気温 / 縦軸: FTSE 100終値</small>
            </div>
            <span class="legend"><i class="history-dot-sample"></i>履歴 <i class="forecast-dot-sample"></i>予想</span>
          </div>
          <svg id="scatterPlot" class="scatter-plot" role="img" aria-label="気温とFTSE終値の散布図、回帰線、明日の予想ポイント"></svg>
          <p id="formulaText" class="formula-text"></p>
        </section>

        <aside class="panel data-panel" aria-labelledby="dataTitle">
          <div class="panel-title">
            <div>
              <span id="dataTitle">履歴データ</span>
              <small>サンプルの日次データ</small>
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>日付</th>
                <th>気温</th>
                <th>FTSE</th>
              </tr>
            </thead>
            <tbody id="dataRows"></tbody>
          </table>
          <p class="disclaimer">
            このダッシュボードは相関と単回帰の可視化デモです。サンプルデータを使っており、実際の投資判断や価格保証を目的としていません。
          </p>
        </aside>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
