<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloomberg風 CVA プライサー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="terminal-shell" aria-labelledby="appTitle">
      <header class="top-bar">
        <div>
          <p class="kicker">EQD &lt;CVA&gt; IRS XVA MONTE CARLO</p>
          <h1 id="appTitle">シンプル CVA プライサー</h1>
        </div>
        <div class="market-clock" aria-label="画面情報">
          <span>USD IRS</span>
          <strong>LIVE CALC</strong>
        </div>
      </header>

      <section class="workspace">
        <form id="pricingForm" class="ticket panel" aria-label="CVA入力フォーム">
          <div class="panel-title">
            <span>TRADE TICKET</span>
            <small>Hull-White 1F / Monte Carlo</small>
          </div>

          <label>
            <span>元本 (USD)</span>
            <input id="notional" name="notional" type="number" min="1000000" step="1000000" value="100000000" required />
          </label>

          <label>
            <span>満期</span>
            <select id="maturity" name="maturity">
              <option value="1">1Y</option>
              <option value="3">3Y</option>
              <option value="5" selected>5Y</option>
              <option value="7">7Y</option>
              <option value="10">10Y</option>
              <option value="15">15Y</option>
              <option value="20">20Y</option>
            </select>
          </label>

          <label>
            <span>サイド</span>
            <select id="side" name="side">
              <option value="payer" selected>固定支払 / 変動受取</option>
              <option value="receiver">固定受取 / 変動支払</option>
            </select>
          </label>

          <div class="grid-two">
            <label>
              <span>固定クーポン</span>
              <input id="fixedRate" name="fixedRate" type="number" min="0" max="0.2" step="0.0001" value="0.034" />
            </label>
            <label>
              <span>回復率</span>
              <input id="recoveryRate" name="recoveryRate" type="number" min="0" max="0.9" step="0.01" value="0.40" />
            </label>
          </div>

          <div class="grid-two">
            <label>
              <span>HW平均回帰</span>
              <input id="meanReversion" name="meanReversion" type="number" min="0.001" max="1" step="0.001" value="0.030" />
            </label>
            <label>
              <span>HWボラ</span>
              <input id="volatility" name="volatility" type="number" min="0.001" max="0.1" step="0.001" value="0.010" />
            </label>
          </div>

          <div class="grid-two">
            <label>
              <span>クレジット・スプレッド</span>
              <input id="creditSpread" name="creditSpread" type="number" min="0.0001" max="0.2" step="0.0001" value="0.0120" />
            </label>
            <label>
              <span>パス数</span>
              <select id="paths" name="paths">
                <option value="500">500</option>
                <option value="1000" selected>1,000</option>
                <option value="2500">2,500</option>
                <option value="5000">5,000</option>
              </select>
            </label>
          </div>

          <button class="primary-action" type="submit">PRICE CVA</button>
        </form>

        <section class="results panel" aria-live="polite">
          <div class="panel-title">
            <span>VALUATION</span>
            <small id="valuationTime">--</small>
          </div>

          <div class="price-tile">
            <span>CVA PRICE</span>
            <output id="cvaPrice" data-testid="cva-price">--</output>
            <button id="copyButton" type="button">COPY</button>
          </div>

          <div class="metrics-grid">
            <div><span>EE AVG</span><strong id="avgEe">--</strong></div>
            <div><span>EE PEAK</span><strong id="peakEe">--</strong></div>
            <div><span>SWAP NPV</span><strong id="swapNpv">--</strong></div>
            <div><span>95% PFE</span><strong id="pfe95">--</strong></div>
          </div>

          <div class="chart-card">
            <div class="chart-head">
              <span>EXPECTED EXPOSURE PROFILE</span>
              <small>Annual grid</small>
            </div>
            <canvas id="exposureChart" width="900" height="260" aria-label="期待エクスポージャーのチャート"></canvas>
          </div>

          <pre id="copyText" class="blotter" aria-label="コピー用評価サマリー">CVA price will appear here after pricing.</pre>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
